const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const COLORS = ['#440154', '#3b528b', '#21918c', '#5ec962', '#fde725'];
const xs = DATA.map(f => f.x), ys = DATA.map(f => f.y);
const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
const kx = Math.cos(((y0 + y1) / 2) * Math.PI / 180);
const sorted = DATA.map(f => f.p).sort((a, b) => a - b);
const cuts = [0.2, 0.4, 0.6, 0.8].map(t => sorted[Math.floor(t * sorted.length)]);
const fmt = v => Math.round(v).toLocaleString('ru-RU');
function bucket(p) { let i = 0; while (i < cuts.length && p >= cuts[i]) i++; return i; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
const labels = ['до ' + fmt(cuts[0]), fmt(cuts[0]) + '–' + fmt(cuts[1]), fmt(cuts[1]) + '–' + fmt(cuts[2]), fmt(cuts[2]) + '–' + fmt(cuts[3]), 'от ' + fmt(cuts[3])];
document.getElementById('legend').innerHTML = labels.map((t, i) => '<div><span style="background:' + COLORS[i] + '"></span>' + t + '</div>').join('') + '<div style="color:var(--muted)">Цвет — население махалли (квинтили)</div>';
let W = 0, H = 0, scale = 1, offX = 0, offY = 0;
function px(f) { return [offX + (f.x - x0) * kx * scale, offY + (y1 - f.y) * scale]; }
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const f of DATA) {
    const [X, Y] = px(f);
    ctx.fillStyle = COLORS[bucket(f.p)];
    ctx.beginPath(); ctx.arc(X, Y, 2.2, 0, Math.PI * 2); ctx.fill();
  }
}
function layout() {
  const dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = (x1 - x0) * kx, h = y1 - y0;
  scale = Math.min(W / w, H / h) * 0.94;
  offX = (W - w * scale) / 2; offY = (H - h * scale) / 2;
  draw();
}
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 64;
  for (const f of DATA) {
    const [X, Y] = px(f);
    const d = (X - mx) ** 2 + (Y - my) ** 2;
    if (d < bd) { bd = d; best = f; }
  }
  if (!best) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = (mx + 14) + 'px'; tip.style.top = (my + 14) + 'px';
  tip.innerHTML = '<b>' + esc(best.n) + '</b><br>' + esc(best.d) + '<br>Население (оценка): ' + fmt(best.p);
});
canvas.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
window.addEventListener('resize', layout);
layout();
